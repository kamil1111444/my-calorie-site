body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px;display:flex;justify-content:center;align-items:flex-start}

.sub{text-align:center;color:#888;font-size:.85rem;margin-bottom:20px}
.row{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.row>*{flex:1;min-width:100px}
label{display:block;font-weight:600;font-size:.8rem;color:#555;margin-bottom:4px}
input,select{width:100%;padding:10px 12px;border:2px solid #e0e0e0;border-radius:10px;font-size:.95rem;font-family:inherit}
input:focus,select:focus{outline:none;border-color:#764ba2}
.search-box{position:relative}
.search-results{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ddd;border-radius:10px;max-height:220px;overflow-y:auto;z-index:100;display:none;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.search-results.show{display:block}
.search-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:.9rem}
.search-item:hover{background:#f7f7fa}
.search-item .kcal{color:#888;font-size:.8rem}
button{padding:10px 18px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.9rem;transition:transform .15s}
button:hover{transform:scale(1.02)}
.btn-calc{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;width:100%;padding:14px;font-size:1rem;margin-top:10px}
.btn-clear{background:#eee;color:#666;width:100%;margin-top:8px}
.ingredients{margin:15px 0}
.ingredient-item{display:flex;justify-content:space-between;align-items:center;background:#f7f7fa;padding:10px 14px;border-radius:10px;margin-bottom:6px;font-size:.9rem}
.ingredient-item .remove{color:#e74c3c;cursor:pointer;font-weight:bold;padding:0 5px}
.result{margin-top:20px;background:#f7f7fa;border-radius:16px;padding:20px;display:none}
.result.show{display:block;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.macro{background:#fff;padding:10px;border-radius:10px}
.macro .val{font-size:1.3rem;font-weight:800;color:#764ba2}
.macro .lbl{font-size:.7rem;color:#888;margin-top:2px}
.cal-highlight{grid-column:span 4;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.cal-highlight .val{color:#fff;font-size:1.8rem}
.cal-highlight .lbl{color:rgba(255,255,255,.85)}
.mineral-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center}
.mineral{background:#fff;padding:10px;border-radius:10px;border-left:4px solid #764ba2}
.mineral .val{font-size:1.2rem;font-weight:800;color:#333}
.mineral .lbl{font-size:.7rem;color:#888}
.vitamins{margin-top:15px;font-size:.85rem;color:#555;line-height:1.6}
.vitamins .tag{display:inline-block;background:#e8e0f0;padding:2px 8px;border-radius:6px;margin:2px;font-size:.8rem}
.recommendation{margin-top:15px;padding:12px;background:#fff3cd;border-radius:10px;font-size:.85rem;color:#856404}
.note{font-size:.7rem;color:#aaa;text-align:center;margin-top:15px}
</style>
</head>

const searchInput=document.getElementById('searchInput'),searchResults=document.getElementById('searchResults');
searchInput.addEventListener('input',function(){
clearTimeout(searchTimeout);
const q=this.value.trim().toLowerCase();
if(q.length<1){searchResults.classList.remove('show');return}
searchTimeout=setTimeout(()=>{
const matches=Object.entries(DB).filter(([k,v])=>v.name.toLowerCase().includes(q)).slice(0,12);
if(matches.length===0){searchResults.classList.remove('show');return}
searchResults.innerHTML=matches.map(([k,v])=>`<div class="search-item" onclick="addItem('${k}')">${v.name} <span class="kcal">${v.kcal} ккал/100г</span></div>`).join('');

});
document.addEventListener('click',function(e){if(!e.target.closest('.search-box'))searchResults.classList.remove('show')});

if(selectedItems.find(i=>i.key===key)){searchInput.value='';searchResults.classList.remove('show');return}
selectedItems.push({key:key,grams:100});searchInput.value='';searchResults.classList.remove('show');renderIngredients()
}
function renderIngredients(){

list.innerHTML=selectedItems.map((item,idx)=>{const food=DB[item.key];return `<div class="ingredient-item"><span><strong>${food.name}</strong></span><span><input type="number" value="${item.grams}" min="1" max="2000" style="width:70px;padding:4px 6px;border:1px solid #ddd;border-radius:6px;text-align:center;" onchange="updateGrams(${idx},this.value)"> г <span class="remove" onclick="removeItem(${idx})">✕</span></span></div>`}).join('')
}
function updateGrams(idx,val){const g=parseFloat(val);if(!isNaN(g)&&g>0)selectedItems[idx].grams=g}
function removeItem(idx){selectedItems.splice(idx,1);renderIngredients()}
function clearAll(){selectedItems=[];renderIngredients();document.getElementById('result').classList.remove('show');document.getElementById('searchInput').value=''}
function calculate(){
if(selectedItems.length===0){alert('Добавь хотя бы один продукт');return}
let total={kcal:0,p:0,f:0,c:0,B1:0,B2:0,C:0,A:0,zn:0,mg:0,fe:0};
selectedItems.forEach(item=>{
const food=DB[item.key],factor=item.grams/100;
total.kcal+=food.kcal*factor;total.p+=food.p*factor;total.f+=food.f*factor;total.c+=food.c*factor;
total.B1+=(food.vitam.B1||0)*factor;total.B2+=(food.vitam.B2||0)*factor;
total.C+=(food.vitam.C||0)*factor;total.A+=(food.vitam.A||0)*factor;
total.zn+=(food.zn||0)*factor;total.mg+=(food.mg||0)*factor;total.fe+=(food.fe||0)*factor
});
document.getElementById('macroGrid').innerHTML=`
<div class="macro cal-highlight"><div class="val">${Math.round(total.kcal)}</div><div class="lbl">ккал</div></div>
<div class="macro"><div class="val">${total.p.toFixed(1)}</div><div class="lbl">Белки, г</div></div>
<div class="macro"><div class="val">${total.f.toFixed(1)}</div><div class="lbl">Жиры, г</div></div>
<div class="macro"><div class="val">${total.c.toFixed(1)}</div><div class="lbl">Углеводы, г</div></div>`;
document.getElementById('mineralGrid').innerHTML=`
<div class="mineral"><div class="val">${total.zn.toFixed(1)}</div><div class="lbl">Цинк, мг</div></div>
<div class="mineral"><div class="val">${Math.round(total.mg)}</div><div class="lbl">Магний, мг</div></div>
<div class="mineral"><div class="val">${total.fe.toFixed(1)}</div><div class="lbl">Железо, мг</div></div>`;
const vitTags=[];
if(total.B1>0)vitTags.push(`B1: ${total.B1.toFixed(2)} мг`);
if(total.B2>0)vitTags.push(`B2: ${total.B2.toFixed(2)} мг`);
if(total.C>0)vitTags.push(`C: ${total.C.toFixed(1)} мг`);
if(total.A>0)vitTags.push(`A: ${Math.round(total.A)} мкг`);
document.getElementById('vitaminsBlock').innerHTML=vitTags.length>0?'<strong>Витамины:</strong><br>'+vitTags.map(t=>`<span class="tag">${t}</span>`).join(' '):'<span style="color:#aaa;">Витаминные данные отсутствуют</span>';
const gender=document.getElementById('gender').value;
const norms=gender==='male'?{B1:1.3,B2:1.2,C:75,A:900,zn:11,mg:410,fe:11}:{B1:1,B2:1,C:65,A:700,zn:9,mg:360,fe:15};
const gaps=[];
if(total.B1>0&&total.B1<norms.B1*.3)gaps.push('B1');
if(total.B2>0&&total.B2<norms.B2*.3)gaps.push('B2');
if(total.C>0&&total.C<norms.C*.3)gaps.push('витамина C');
if(total.A>0&&total.A<norms.A*.3)gaps.push('витамина A');
if(total.zn>0&&total.zn<norms.zn*.3)gaps.push('цинка');
if(total.mg>0&&total.mg<norms.mg*.3)gaps.push('магния');
if(total.fe>0&&total.fe<norms.fe*.3)gaps.push('железа');
document.getElementById('recommendationBlock').innerHTML=gaps.length>0?`💡 <strong>Возможно, не хватает:</strong> ${gaps.join(', ')}. Добавь мясо/печень, орехи/семечки, овощи/фрукты.`:'✅ По базовым нутриентам выглядит неплохо.';
document.getElementById('result').classList.add('show')
}
</script>
